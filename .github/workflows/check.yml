name: 🧪 Check

on:
  push:
    branches:
      - master
      - feat/serde_yml
  pull_request:
    branches:
      - master
      - feat/serde_yml
  release:
    types: [created]

permissions:
  contents: read

jobs:
  all:
    name: Check
    runs-on: ubuntu-latest
    steps:
      - uses: hecrj/setup-rust-action@v2.0.1
        with:
          components: clippy
      - uses: actions/checkout@v6.0.3
      - name: Check lints
        run: cargo check --all-targets --workspace --all-features
